[package]
name = "modrn"
version = "0.3.0"
edition = "2021"
authors = ["Rory Spring-Vanhorne <rory.spring@icloud.com>"]
description = "Keeps Rust module declarations (mod.rs, lib.rs, main.rs) in sync with the files on disk"
license = "MIT"
repository = "github.com/elci-group/modrn"
keywords = ["rust", "modules", "codegen", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "modrn"
path = "src/main.rs"

[[bin]]
name = "cargo-modrn"
path = "src/bin/cargo-modrn.rs"

[lib]
name = "modrn"
path = "src/lib.rs"

[dependencies]
console = "0.16.1"
walkdir = "2.4"
notify = { version = "6.1", optional = true }

[features]
default = []
fsnotify = ["notify"]

[dev-dependencies]
tempfile = "3"
